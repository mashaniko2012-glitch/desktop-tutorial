<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOBRO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;color:#3d2d23}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
#home{height:100svh;min-height:520px;position:relative;display:grid;place-items:center;overflow:hidden;background:#fff}
#cat{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,#21170f9c,transparent 64%)}
.home-content{position:absolute;bottom:max(7%,env(safe-area-inset-bottom));width:100%;text-align:center;color:white}
h1{font-size:clamp(56px,14vw,100px);letter-spacing:.14em;margin:0 0 14px;text-shadow:0 4px 16px #0008}
#play{background:#ead8bb;color:#62482f;border:0;border-radius:99px;padding:15px 65px;font-size:22px;font-weight:950;letter-spacing:.13em;box-shadow:0 6px #b99a77}
#game{display:none;height:100svh;min-height:520px;position:relative;overflow:hidden;background:linear-gradient(#9bdcf5 0%,#d8f3fc 68%,#9bd477 68%,#69a94e 100%)}
.cloud{position:absolute;font-size:60px;opacity:.72;pointer-events:none}
#hud{position:absolute;z-index:3;top:12px;left:12px;padding:9px 13px;border-radius:13px;background:#ffffffdf;font-weight:900;line-height:1.7}
#sun{position:absolute;z-index:3;top:12px;right:14px;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#ffe16c;font-size:25px;font-weight:950}
#field{position:absolute;inset:115px 0 0;overflow:hidden}
.target{position:absolute;border:0;background:transparent;padding:0;font-size:clamp(38px,9vw,58px);line-height:1;filter:drop-shadow(0 3px 2px #0002);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px) rotate(5deg)}}
#dog-overlay{display:none;position:absolute;z-index:7;inset:0;background:#17202a66;align-items:center;justify-content:center;padding:18px}
#dog-card{width:min(82vw,370px);background:#fff8ec;border-radius:20px;padding:10px;box-shadow:0 10px 35px #0006}
#dog-card img{display:block;width:100%;max-height:70svh;object-fit:contain;border-radius:13px}
#chicken{display:none;position:absolute;z-index:6;width:min(34vw,155px);text-align:center;font-weight:900;animation:sweep .55s ease-in-out 4 alternate}
#chicken img{width:100%;display:block;border-radius:12px}
#chicken .broom{position:absolute;right:-16px;top:42%;font-size:34px;animation:sweepbroom .55s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(22px)}}@keyframes sweepbroom{to{transform:rotate(35deg)}}
#end{display:none;position:absolute;z-index:10;inset:0;background:#21170fbb;align-items:center;justify-content:center;padding:16px}
.panel{width:min(92vw,420px);max-height:90%;overflow:auto;background:#fff8ec;border-radius:22px;padding:22px;text-align:center;box-shadow:0 12px 40px #0005}
.panel h2{margin:0 0 6px;font-size:30px}.panel input{width:100%;padding:12px;border:2px solid #d5c1a2;border-radius:10px;margin:8px 0 12px}
.action{border:0;border-radius:30px;background:#76533c;color:white;padding:11px 18px;margin:4px;font-weight:850}
#leader{text-align:left;max-height:140px;overflow:auto}.note{font-size:12px;opacity:.75}
.hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#356b2b;font-weight:850;font-size:clamp(12px,3vw,16px);pointer-events:none}
</style></head><body>

(()=>{'use strict';
const $=id=>document.getElementById(id);let score=0,seconds=60,timer=null,spawner=null,playing=false,dogTimer=null,chickenTimer=null;

function add(e,p){let b=document.createElement('button');b.type='button';b.className='target';b.textContent=e;b.style.left=(3+Math.random()*88)+'%';b.style.top=(3+Math.random()*70)+'%';b.addEventListener('click',()=>{if(!playing)return;score=Math.max(0,score+p);hud();b.remove();if(e==='🥕')showDog();if(e==='💩')showChicken();if(Math.random()<.8)add('🦫',1)});$('field').appendChild(b)}
function scores(){try{return JSON.parse(localStorage.getItem('bobroScores')||'[]')}catch(e){return[]}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let a=scores().sort((x,y)=>y.score-x.score).slice(0,10);$('leader').innerHTML='<b>TOP 10</b><ol>'+a.map(x=>'<li>'+esc(x.name)+' — '+x.score+'</li>').join('')+'</ol>'}
function finish(){playing=false;clearInterval(timer);clearInterval(spawner);$('final-score').textContent=score;$('end').style.display='flex';$('field').innerHTML='';render()}
function start(){clearInterval(timer);clearInterval(spawner);score=0;seconds=60;playing=true;$('end').style.display='none';$('dog-overlay').style.display='none';$('chicken').style.display='none';$('field').innerHTML='';$('rank').textContent='';hud();for(let i=0;i<6;i++)add('🦫',1);add('🥕',3);timer=setInterval(()=>{seconds--;hud();if(seconds<=0)finish()},1000);spawner=setInterval(()=>{if(!playing)return;let n=Math.random();add(n<.14?'💩':n<.25?'🥕':'🦫',n<.14?-1:n<.25?3:1)},850)}
$('play').addEventListener('click',()=>{$('home').style.display='none';$('game').style.display='block';start()});
$('dog-overlay').addEventListener('click',()=>$('dog-overlay').style.display='none');
$('save').addEventListener('click',()=>{let name=$('nickname').value.trim()||'Player',a=scores();a.push({name,score});a.sort((x,y)=>y.score-x.score);try{localStorage.setItem('bobroScores',JSON.stringify(a.slice(0,10)))}catch(e){}let pos=a.findIndex(x=>x.name===name&&x.score===score)+1;$('rank').textContent='Your position: '+(pos<=10?'#'+pos:'➖');$('save').textContent='SAVED!';render()});
$('again').addEventListener('click',()=>{$('save').textContent='SAVE SCORE';$('nickname').value='';start()});
$('home-button').addEventListener('click',()=>{clearInterval(timer);clearInterval(spawner);playing=false;$('game').style.display='none';$('home').style.display='grid'});
})();
</script></body></html>
